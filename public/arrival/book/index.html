<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>你一生的故事 · 人物速查</title>
<style>
/* 调色板由 build_html.py 按书注入，见 references/palettes.md。
   零外部依赖：不联网、不加载字体，离线可用。 */
:root{
  --bg:#F4F5F6;
  --bg-sticky:rgba(244,245,246,.88);
  --card:#FFFFFF;
  --ink:#191C1F;
  --ink-2:#42484E;
  --dim:#7E868D;
  --rule:#DDE1E4;
  --accent:#2E5C7A;
  --accent-wash:#E4EDF3;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15161A;--bg-sticky:rgba(21,22,26,.9);--card:#1D1F24;--ink:#E8E5E0;--ink-2:#B2ADA5;--dim:#7C7770;--rule:#2C2F36;--accent:#6FA8CC;--accent-wash:rgba(111,168,204,.12);}}
:root[data-theme=dark]{--bg:#15161A;--bg-sticky:rgba(21,22,26,.9);--card:#1D1F24;--ink:#E8E5E0;--ink-2:#B2ADA5;--dim:#7C7770;--rule:#2C2F36;--accent:#6FA8CC;--accent-wash:rgba(111,168,204,.12);}
:root{
  --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  --sans:"PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;
}
/* .wrap 只写左右内边距，绝不用 padding 简写——否则后面任何同时挂 .wrap
   和别的类的元素会把左右内边距整个重置掉。这个坑在 odyssey.html 上踩过一次。 */
.wrap{max-width:1080px;margin:0 auto;padding-left:22px;padding-right:22px}

header{border-bottom:1px solid var(--rule);padding-top:38px;padding-bottom:26px}
.kicker{font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
h1{font:700 clamp(27px,4.4vw,40px)/1.2 var(--serif);margin:14px 0 0;letter-spacing:.01em;text-wrap:balance}
.byline{margin:9px 0 0;color:var(--dim);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:20px;margin:22px 0 0;font:400 13px/1 var(--mono);color:var(--dim)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* 进度控件 */
.prog{position:sticky;top:0;z-index:9;background:var(--bg-sticky);
  border-bottom:1px solid var(--rule);padding-top:13px;padding-bottom:13px;
  backdrop-filter:saturate(1.4) blur(8px)}
.prog-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog label{font-size:13.5px;color:var(--dim);flex:none}
.prog output{font:600 15px/1 var(--mono);color:var(--accent);min-width:2.6em;
  font-variant-numeric:tabular-nums;flex:none}
.prog input[type=range]{flex:1 1 220px;min-width:180px;accent-color:var(--accent)}
.prog .hint{flex-basis:100%;font-size:12.5px;color:var(--dim);margin:0}
.ghost{appearance:none;cursor:pointer;background:none;border:1px solid var(--rule);
  border-radius:100px;color:var(--dim);font:400 12.5px/1 var(--sans);padding:7px 14px;flex:none}
.ghost[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}

section{padding-top:44px;padding-bottom:12px}
h2{font:600 21px/1.3 var(--serif);margin:0 0 6px}
.sub{color:var(--dim);font-size:13.5px;margin:0 0 22px;max-width:62ch}

/* 人物表 */
.people{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.p{border:1px solid var(--rule);border-radius:4px;background:var(--card);
  border-left:3px solid var(--accent);padding:15px 17px}
.p.title-only{border-left-style:dashed}
.p-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.zh{font:700 19px/1.25 var(--serif)}
.mn{font:600 11px/1 var(--mono);letter-spacing:.06em;color:var(--accent);
  background:var(--accent-wash);border-radius:3px;padding:4px 7px;flex:none}
.orig{font:400 12.5px/1.4 var(--mono);color:var(--dim);margin:5px 0 0}
.orig .guess{opacity:.7}
.who{margin:9px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.65}
.meta{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--rule);
  font:400 11.5px/1 var(--mono);color:var(--dim);display:flex;gap:12px;flex-wrap:wrap;
  font-variant-numeric:tabular-nums}
.alias{margin:7px 0 0;font-size:12.5px;color:var(--dim)}
.alias b{font-weight:500;color:var(--ink-2)}

/* 易混簇 */
.cl{border:1px solid var(--rule);border-radius:4px;background:var(--card);
  padding:15px 17px;margin-bottom:11px}
.cl-why{font:500 12px/1 var(--mono);letter-spacing:.05em;color:var(--accent);
  text-transform:uppercase;margin-bottom:11px}
.cl-row{display:flex;gap:12px;align-items:baseline;padding:6px 0;border-top:1px solid var(--rule)}
.cl-row:first-of-type{border-top:0}
.cl-row .zh{font-size:16px;flex:none;min-width:6.2em}
.cl-row .d{font-size:13px;color:var(--ink-2);line-height:1.6}

details{border-top:1px solid var(--rule);padding:14px 0}
summary{cursor:pointer;font:500 14px/1 var(--sans);color:var(--dim)}
summary:hover{color:var(--ink)}
details ul{margin:14px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink-2);line-height:1.8}
details code{font:400 12.5px var(--mono);background:var(--accent-wash);
  border-radius:3px;padding:1px 5px}

.empty{color:var(--dim);font-size:13.5px;padding:18px 0}
#related{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
#related a{display:inline-flex;align-items:baseline;gap:9px;color:var(--ink);
  text-decoration:none;border:1px solid var(--rule);border-radius:4px;
  padding:12px 15px;background:var(--card);font-size:14px}
#related a:hover{border-color:var(--accent)}
#related .warn{font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:#fff;
  background:var(--accent);border-radius:3px;padding:4px 7px;flex:none;text-transform:uppercase}
#related .arrow{margin-left:auto;color:var(--dim)}
footer{border-top:1px solid var(--rule);margin-top:46px;padding-top:22px;padding-bottom:52px;
  color:var(--dim);font-size:12.5px;line-height:1.8}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .wrap{padding-left:16px;padding-right:16px}
  .cl-row{flex-direction:column;gap:3px}
  .cl-row .zh{min-width:0}
}
</style>
</head>

<header class="wrap">

  <section>

    <details id="unsureBox"><summary></summary><ul id="unsure"></ul></details>
    <details id="termBox"><summary></summary><ul id="terms"></ul></details>
  </section>
</main>

<footer class="wrap">
  <nav id="related" hidden></nav>
  <p id="foot"></p>
  <p>人物身份是由只读过对应章节的抽取任务写的，所以按进度过滤是有效的；但同一批次内部

</footer>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const N = G.chapter_count;
const range = $('#p'), out = $('#pv'), allBtn = $('#all');
range.max = N;
let showAll = false;

// 只要 first_ch 不大于当前进度就算「已出现」。first_ch 为 null 的（抽取没给出）
// 按最保守处理：只在「显示全部」时出现。
const seen = (e, p) => showAll || (e.first_ch != null && e.first_ch <= p);

function personCard(e){
  const orig = e.original
    ? `<p class="orig">${esc(e.original)}${e.original_guess
        ? ' <span class="guess">· 推测</span>' : ''}</p>` : '';
  const mn = e.mnemonic && e.mnemonic !== e.display
    ? `<span class="mn">记「${esc(e.mnemonic)}」</span>` : '';
  const alias = e.aliases && e.aliases.length
    ? `<p class="alias">书中也写作 <b>${e.aliases.map(esc).join('、')}</b></p>` : '';
  const meta = [
    e.first_ch != null ? `首见 第${e.first_ch}节` : '首见 未知',
    `${e.count} 次`,
    e.speaks ? '有台词' : '无台词',
    e.addressed ? '被称呼' : '未被称呼',
  ].map(t => `<span>${esc(t)}</span>`).join('');
  return `<article class="p${e.name_kind === 'title' ? ' title-only' : ''}">
    <div class="p-top"><span class="zh">${esc(e.display)}</span>${mn}</div>
    ${orig}${e.who ? `<p class="who">${esc(e.who)}</p>` : ''}${alias}
    <div class="meta">${meta}</div></article>`;
}

function render(){
  const p = +range.value;
  out.textContent = showAll ? '全' : p;

  const vis = G.people.filter(e => seen(e, p));
  vis.sort((a, b) => (b.count - a.count));
  $('#people').innerHTML = vis.map(personCard).join('');
  $('#peopleEmpty').hidden = vis.length > 0;
  $('#peopleSub').textContent = showAll
    ? `全书 ${G.people.length} 人，按出场密度排序。`
    : `第 ${p} 节为止出现过的 ${vis.length} 人（全书 ${G.people.length} 人），按出场密度排序。`;

  const byId = Object.fromEntries(vis.map(e => [e.id, e]));
  const cls = (G.confusable || [])
    .map(c => ({...c, ms: c.ids.map(i => byId[i]).filter(Boolean)}))
    .filter(c => c.ms.length >= 2);
  $('#cl').innerHTML = cls.map(c => `<div class="cl">
      <div class="cl-why">${esc(c.kind)} · ${esc(c.why)}</div>
      ${c.ms.map(m => `<div class="cl-row"><span class="zh">${esc(m.display)}</span>
        <span class="d">${esc(m.who || (m.original || ''))}</span></div>`).join('')}
    </div>`).join('');
  $('#clEmpty').hidden = cls.length > 0;

  $('#hint').textContent = showAll
    ? '已解除进度限制——下面会出现全书所有人物，包含后文才登场的。'
    : (p === 0
      ? '第 0 节 = 翻开书之前。往右拖到你现在读到的位置，只会显示到那时为止已经出现的人物。'
      : `只显示第 ${p} 节为止已经出现的人物。`);
}

range.addEventListener('input', () => { showAll = false; allBtn.setAttribute('aria-pressed','false'); render(); });
allBtn.addEventListener('click', () => {
  showAll = !showAll; allBtn.setAttribute('aria-pressed', String(showAll)); render();
});

// 记住上次读到哪 —— 每个浏览器各自存，读不到就当 0
try {
  const k = 'rg:' + G.slug;
  const v = localStorage.getItem(k);
  if (v != null && +v >= 0 && +v <= N) range.value = +v;
  range.addEventListener('change', () => { try { localStorage.setItem(k, range.value); } catch (e) {} });
} catch (e) {}

// 静态部分
$('#byline').textContent = [G.creator, G.translator].filter(Boolean).join(' · ');
$('#stats').innerHTML = [
  ['全书', `${G.total_chars.toLocaleString()} 字`],
  ['切分', `${N} 节`],
  ['人物', `${G.people.length} 人`],
  ['易混组', `${(G.confusable || []).length} 组`],
].map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join('');

$('#unsureBox').querySelector('summary').textContent =
  `机器没把握的 ${G.unsure.length} 条（可能是人，也可能不是）`;
$('#unsure').innerHTML = G.unsure.map(e =>
  `<li><code>${esc(e.display)}</code> ${e.count} 次，首见第 ${e.first_ch ?? '?'} 节 —— ${esc(e.who)}
   ${(e.notes || []).map(n => `<br><small>${esc(n)}</small>`).join('')}</li>`).join('')
  || '<li>没有。</li>';

$('#termBox').querySelector('summary').textContent =
  `判为「不是人」的 ${G.terms.length} 条（阶层 / 组织 / 地名 / 术语）`;
$('#terms').innerHTML = G.terms.map(e =>
  `<li><code>${esc(e.display)}</code> → ${esc(e.kind)} —— ${esc(e.who)}</li>`).join('')
  || '<li>没有。</li>';

if (G.related && G.related.length) {
  $('#related').hidden = false;
  $('#related').innerHTML = G.related.map(r =>
    `<a href="${esc(r.href)}">${r.spoiler ? '<span class="warn">含剧透</span>' : ''}
     <span>${esc(r.label)}</span><span class="arrow">→</span></a>`).join('');
}

$('#foot').textContent = G.narrator && G.narrator.present
  ? `本书是${G.narrator.person === 'first' ? '第一人称' : '第三人称'}叙述。`
    + (G.narrator.note ? ' ' + G.narrator.note : '')
  : '';

render();
</script>
</body>
</html>
